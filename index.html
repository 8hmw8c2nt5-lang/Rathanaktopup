
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RATHANAK TOPUP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:30px 12px;background:#211707;border-bottom:2px solid gold}
h1{color:#ffd76b;margin:0}
header p{color:#ff9fc7}
main{max-width:500px;margin:25px auto;padding:15px}
h2{text-align:center;color:#ffd76b}
.packages{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.package{background:#191919;border:1px solid #d6a83e;border-radius:12px;padding:20px 8px;text-align:center;cursor:pointer}
.package.selected{background:#49300d;border:2px solid gold}
.package h3{margin:0 0 10px}
.price{font-size:22px;color:#ff9fc7;font-weight:bold}
form{margin-top:25px;padding:20px;background:#191919;border:1px solid #a47a2c;border-radius:12px}
label{display:block;color:#ffd76b;margin:13px 0 7px}
input{width:100%;padding:13px;background:#292929;border:1px solid #777;border-radius:8px;color:white;font-size:16px}
button{width:100%;padding:14px;margin-top:20px;background:linear-gradient(90deg,#bd8b2d,#ffe08a);border:0;border-radius:8px;font-size:17px;font-weight:bold}
#result{text-align:center;color:#ff9fc7}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>👑 RATHANAK TOPUP 👑</h1>
<p>Mobile Legends Diamond Store</p>
<p>សូមស្វាគមន៍មកកាន់ហាងរបស់យើង ❤️</p>
</header>

<main>
<h2>💎 ជ្រើសរើស Diamond</h2>
<div class="packages">
<div class="package" onclick="choose(this,'86','$1.29')">
<h3>86 Diamonds</h3><div class="price">$1.29</div>
</div>
<div class="package" onclick="choose(this,'172','$2.55')">
<h3>172 Diamonds</h3><div class="price">$2.55</div>
</div>
<div class="package" onclick="choose(this,'257','$3.69')">
<h3>257 Diamonds</h3><div class="price">$3.69</div>
</div>
<div class="package" onclick="choose(this,'343','$4.89')">
<h3>343 Diamonds</h3><div class="price">$4.89</div>
</div>
</div>

<form onsubmit="order(event)">
<h2>📋 ព័ត៌មានបញ្ជាទិញ</h2>
<label>Diamond</label>
<input id="diamond" placeholder="ជ្រើសរើស Diamond" readonly required>
<label>User ID</label>
<input id="uid" placeholder="បញ្ចូល User ID" required>
<label>Zone ID</label>
<input id="zone" placeholder="បញ្ចូល Zone ID" required>
<label>តម្លៃ</label>
<input id="price" placeholder="តម្លៃ" readonly>
<button type="submit">បញ្ជាទិញឥឡូវនេះ</button>
<p id="result"></p>
</form>
</main>

<footer>© 2026 RATHANAK TOPUP ❤️</footer>

<script>
function choose(el,diamond,price){
document.querySelectorAll('.package').forEach(p=>p.classList.remove('selected'));
el.classList.add('selected');
document.getElementById('diamond').value=diamond+' Diamonds';
document.getElementById('price').value=price;
}
function order(event){
event.preventDefault();
document.getElementById('result').innerText='នេះជាគំរូបញ្ជាទិញប៉ុណ្ណោះ។ មិនទាន់បានផ្ញើការបញ្ជាទិញទេ។';
}
</script>
</body>
</html>
