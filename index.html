<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RATHANAK TOPUP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0714;color:#fff}.wrap{max-width:980px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#241044,#641cc0);padding:34px 24px;border-radius:22px;text-align:center}.hero h1{font-size:clamp(30px,7vw,54px);margin:0 0 8px}.hero p{color:#e7d7ff}.tag{display:inline-block;background:#a855f7;padding:7px 13px;border-radius:30px;font-size:13px}.panel{margin-top:22px;background:#171022;border:1px solid #392453;border-radius:18px;padding:22px}.packages{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.pkg{background:#211632;border:1px solid #57347a;border-radius:13px;padding:17px;text-align:center}.pkg b{display:block;font-size:19px;color:#d9b5ff}.pkg span{font-size:13px;color:#c9bad8}.field{display:block;margin:14px 0}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #60427e;background:#0e0a16;color:white;margin-top:7px}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:#a855f7;color:#fff;font-weight:bold;font-size:16px;margin-top:12px}.note{color:#b9a9c9;font-size:13px;line-height:1.6}.selected{outline:2px solid #d8b4fe;background:#382050}
</style></head><body><main class="wrap"><header class="hero"><span class="tag">MOBILE LEGENDS TOP UP</span><h1>RATHANAK TOPUP</h1><p>Fast • Simple • Convenient</p></header>
<section class="panel"><h2>ជ្រើសរើស Diamond</h2><div class="packages" id="packages"><button class="pkg" onclick="choose(this,'86 Diamonds')"><b>86 💎</b><span>តម្លៃកំណត់ពេលក្រោយ</span></button><button class="pkg" onclick="choose(this,'172 Diamonds')"><b>172 💎</b><span>តម្លៃកំណត់ពេលក្រោយ</span></button><button class="pkg" onclick="choose(this,'257 Diamonds')"><b>257 💎</b><span>តម្លៃកំណត់ពេលក្រោយ</span></button><button class="pkg" onclick="choose(this,'344 Diamonds')"><b>344 💎</b><span>តម្លៃកំណត់ពេលក្រោយ</span></button></div></section>
<section class="panel"><h2>ព័ត៌មានការបញ្ជាទិញ</h2><label class="field">User ID<input id="uid" placeholder="បញ្ចូល User ID"></label><label class="field">Zone ID<input id="zone" placeholder="បញ្ចូល Zone ID"></label><label class="field">លេខទំនាក់ទំនង (ស្រេចចិត្ត)<input id="contact" placeholder="លេខទូរស័ព្ទ"></label><p id="chosen" class="note">មិនទាន់ជ្រើសរើសកញ្ចប់ទេ</p><button class="btn" onclick="order()">បញ្ជាទិញ</button><p class="note">នេះជាគំរូមុខវេបសាយប៉ុណ្ណោះ។ មិនទាន់មានការទូទាត់ ឬបញ្ចូល Diamond ពិតប្រាកដទេ។ សូមកុំផ្ញើលេខសម្ងាត់គណនីហ្គេម។</p></section><footer class="note" style="text-align:center;padding:24px">© RATHANAK TOPUP</footer></main>
<script>let selected='';function choose(el,name){document.querySelectorAll('.pkg').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selected=name;document.getElementById('chosen').textContent='កញ្ចប់ដែលបានជ្រើស៖ '+name}function order(){let uid=document.getElementById('uid').value.trim(),zone=document.getElementById('zone').value.trim();if(!selected||!uid||!zone){alert('សូមជ្រើសរើស Diamond និងបំពេញ User ID / Zone ID');return}alert('នេះជាគំរូប៉ុណ្ណោះ។ ការបញ្ជាទិញមិនទាន់ត្រូវបានផ្ញើទេ។\n'+selected+'\nUser ID: '+uid+'\nZone ID: '+zone)}</script></body></html>
